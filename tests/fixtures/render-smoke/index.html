<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>/shipreel render smoke test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #120b08; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
      .scene { position: absolute; inset: 0; }
      .orange { background: #e8501f; color: #1a0f0b; }
      .dark { background: #120b08; color: #f6eee8; }
      .headline { position: absolute; left: 160px; top: 380px; width: 1600px; font-size: 150px; font-weight: 900; line-height: 1; }
      .block { position: absolute; left: 160px; top: 640px; width: 900px; height: 160px; border-radius: 24px; background: #ff9a6b; }
      .bar { position: absolute; left: 160px; top: 700px; width: 1600px; height: 60px; border-radius: 30px; background: #e8501f; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3">
      <section id="scene-a" class="clip scene orange" data-start="0" data-duration="1.5" data-track-index="0">
        <h1 id="a-title" class="headline">render smoke test</h1>
        <div id="a-block" class="block"></div>
      </section>
      <section id="scene-b" class="clip scene dark" data-start="1.5" data-duration="1.5" data-track-index="0">
        <h1 id="b-title" class="headline">still rendering</h1>
        <div id="b-bar" class="bar"></div>
      </section>
      <audio id="tone" src="assets/tone.wav" data-start="0" data-duration="3" data-track-index="10" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#a-title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#a-block", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.fromTo("#b-title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.55);
      tl.fromTo("#b-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 1.7);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
