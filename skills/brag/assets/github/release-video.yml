# /brag release video: renders a short video for every published release and attaches it
# (release.mp4 + release.jpg poster) to the release.
#
# Setup: none. It uses the workflow's own GITHUB_TOKEN (contents: write to upload the files).
# Highlights come from the release notes, or from commit subjects since the previous tag.
# Run it by hand for an existing tag from the Actions tab.
name: brag release video

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to make a video for
        required: true
      format:
        description: landscape, vertical, or square
        default: landscape

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: irvinosazee/brag@main
        with:
          mode: release
          tag: ${{ inputs.tag || github.event.release.tag_name }}
          format: ${{ inputs.format || 'landscape' }}
